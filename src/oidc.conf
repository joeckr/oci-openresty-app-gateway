server {
    resolver ${NGINX_RESOLVER} valid=30s;

    listen 8080;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    set $backend_auth_token "";

    access_by_lua_block {
        if ngx.req.get_method() == "OPTIONS" then
            return ngx.exit(ngx.HTTP_OK)
        end

        local oidc_enabled = os.getenv("OIDC_ENABLED")
        local headers = ngx.req.get_headers()
        local auth_header = ngx.var.http_authorization

        if oidc_enabled ~= "true" then
            return
        end

        local auth_opts = {
            discovery = os.getenv("OIDC_ISSUER") .. "/.well-known/openid-configuration",
            client_id = os.getenv("OIDC_CLIENT_ID"),
            client_secret = os.getenv("OIDC_CLIENT_SECRET"),
            redirect_uri = os.getenv("OIDC_REDIRECT_URI") .. "/redirect_uri",
            logout_path = "/logout",
            redirect_after_logout_uri = os.getenv("OIDC_REDIRECT_URI") .. "/logged_out/",
            redirect_after_logout_with_id_token_hint = true,
            scope = "openid profile email roles",
            ssl_verify = os.getenv("OIDC_SSL_VERIFY"),
            keep_token_per_request = true,
            renew_access_token_on_expiry = true
        }

        local bearer_method = os.getenv("OIDC_BEARER_VALIDATION_METHOD") or "jwt"

        local jwt_opts = {
            discovery = os.getenv("OIDC_ISSUER") .. "/.well-known/openid-configuration",
            ssl_verify = os.getenv("OIDC_SSL_VERIFY"),
            accept_none_alg = false
        }

        local intro_opts = {
            discovery = os.getenv("OIDC_ISSUER") .. "/.well-known/openid-configuration",
            client_id = os.getenv("OIDC_CLIENT_ID"),
            client_secret = os.getenv("OIDC_CLIENT_SECRET"),
            scope = "openid profile email roles",
            ssl_verify = os.getenv("OIDC_SSL_VERIFY")
        }

        local session_opts = {
            storage = "shm",
            shm_zone = "sessions",
            cookie_http_only = true,
            cookie_secure = (os.getenv("OIDC_COOKIE_SECURE") == "true"),
            cookie_same_site = "Lax",
            renew = false,
            secret = os.getenv("OIDC_SESSION_SECRET")
        }

        local oidc = require("resty.openidc")
        local has_bearer = auth_header and string.match(auth_header, "^[Bb][Ee][Aa][Rr][Ee][Rr]%s+(.+)")
        local is_api = has_bearer or (headers["accept"] and headers["accept"]:find("application/json"))

        if is_api then
            local res, err
            if bearer_method == "introspect" then
                if has_bearer then
                    res, err = oidc.introspect(intro_opts)
                else
                    res, err = oidc.authenticate(auth_opts, nil, "deny", session_opts)
                end
            else
                res, err = oidc.bearer_jwt_verify(jwt_opts)
            end

            if err then
                ngx.log(ngx.ERR, "OIDC Bearer API Authentication Failed (", bearer_method, "): ", err)
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            ngx.var.backend_auth_token = auth_header
            return
        else
            local res, err = oidc.authenticate(auth_opts, nil, nil, session_opts)

            if err then
                ngx.log(ngx.ERR, "OIDC Web App Authentication Failed: ", err)
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
        end
    }

    include /etc/nginx/oidc/*.conf;
}
