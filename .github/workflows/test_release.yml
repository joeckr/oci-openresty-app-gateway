name: TEST Release

on:
  pull_request:
    branches: [main]

jobs:
  matrix-build:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: joeckr/ci-templates/.github/workflows/build-oci-modified.yml@578d91388a3f7862fb51c4d2e685586a4d7d1daf  # v1.20.3
    with:
      image: "openresty"
      dry-run: true
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@578d91388a3f7862fb51c4d2e685586a4d7d1daf  # v1.20.3
    with:
      dry-run: true
